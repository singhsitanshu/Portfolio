<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3ee" />
    <!-- ?v= busts cached copies of the earlier icon; bump it when the favicon changes. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <!-- Apply motion preferences and arm the homepage intro before first paint. -->
    <script>
      try{if(localStorage.getItem('portfolio-reduce-motion')==='true')document.documentElement.setAttribute('data-reduce-motion','')}catch(e){}
      (() => {
        const root = document.documentElement;
        const media = matchMedia('(prefers-reduced-motion: no-preference)');
        if (location.pathname !== '/' || location.hash || root.hasAttribute('data-reduce-motion') || !media.matches) return;
        root.setAttribute('data-paper-opening', '');
        const controller = new AbortController();
        const options = { passive: true, signal: controller.signal };
        const finish = () => {
          root.removeAttribute('data-paper-opening');
          controller.abort();
          clearTimeout(timeout);
        };
        // Restore the page even if the client bundle cannot load.
        const timeout = setTimeout(finish, 2000);
        // Listen before hydration so even the first keystroke skips the intro.
        for (const event of ['keydown', 'pointerdown', 'wheel', 'touchstart', 'focusin', 'pagehide', 'popstate', 'hashchange']) window.addEventListener(event, finish, options);
        window.addEventListener('animationend', event => {
          if (event.animationName === 'paper-arrive') finish();
        }, options);
        media.addEventListener('change', finish, options);
      })();
    </script>
    <!--metadata:start--><!--metadata:end-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
